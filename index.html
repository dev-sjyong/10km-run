<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>10km D-58 훈련</title>
<style>
:root {
  --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6e6e73;
  --line:#e5e5ea; --green:#34c759; --blue:#007aff; --orange:#ff9500;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{padding-bottom:max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 40px}
.hero{background:var(--card);border-radius:22px;padding:20px 18px;box-shadow:0 1px 8px rgba(0,0,0,.06);margin-bottom:14px}
h1{font-size:30px;line-height:1.15;margin:0 0 8px;letter-spacing:-.7px}
.sub{font-size:15px;color:var(--muted);line-height:1.5}
.progress{height:14px;background:#ececf0;border-radius:999px;overflow:hidden;margin-top:16px}
.bar{height:100%;width:0;background:var(--green);transition:.25s}
.stats{display:flex;justify-content:space-between;align-items:end;margin-top:8px;gap:8px}
.stats b{font-size:20px}
.stats span{font-size:13px;color:var(--muted)}
.todayTitle{font-size:20px;font-weight:800;margin:18px 2px 10px}
.todayCard{background:#111;color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}
.todayDate{font-size:14px;opacity:.72}
.todayType{font-size:22px;font-weight:800;margin-top:4px}
.todayDesc{font-size:17px;line-height:1.55;margin-top:10px}
.todayMeta{font-size:13px;opacity:.72;margin-top:8px}
.todayActions{display:flex;gap:8px;margin-top:14px}
.todayActions button{flex:1;border:0;border-radius:14px;padding:13px 12px;font-size:16px;font-weight:700}
.doneBtn{background:var(--green);color:#fff}
.skipBtn{background:#2c2c2e;color:#fff}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.sectionHead h2{font-size:20px;margin:0}
.filter{border:0;background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:9px 0;display:grid;grid-template-columns:34px 1fr;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.035)}
.card.today{outline:2px solid var(--blue)}
.card.done{opacity:.55}
.cb{width:28px;height:28px;accent-color:var(--green);margin-top:2px}
.rowTop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.date{font-size:16px;font-weight:800}
.tag{font-size:12px;background:#f1f1f3;padding:5px 8px;border-radius:999px;white-space:nowrap}
.desc{font-size:16px;line-height:1.5;margin-top:7px}
.meta{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.noteInput{width:100%;margin-top:10px;border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:10px 11px;font-size:14px}
.empty{background:var(--card);border-radius:18px;padding:18px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);line-height:1.55;margin-top:18px;padding:0 2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>10km D-58 훈련</h1>
    <div class="sub">2026.08.13 시작 · 2026.10.10 대회<br>목표: 10km Sub-60 도전</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="stats">
      <b id="pct">0%</b>
      <span id="count">0 / 59 완료</span>
    </div>
  </div>

  <div class="todayTitle">오늘의 훈련</div>
  <div id="todayBox"></div>

  <div class="sectionHead">
    <h2>전체 일정</h2>
    <button class="filter" id="filterBtn" onclick="toggleFilter()">미완료만</button>
  </div>
  <div id="list"></div>

  <div class="foot">
    완료 체크와 메모는 이 기기의 Safari에 저장됩니다. GitHub Pages 주소를 Safari에서 연 뒤
    공유 → 홈 화면에 추가를 하면 앱처럼 사용할 수 있습니다.
  </div>
</div>

<script>
const DATA = [{"date": "2026-08-13", "dateLabel": "08/13", "weekday": "목", "type": "러닝", "desc": "걷기 7분 → 2분 달리기 + 2분 걷기 × 8 → 걷기 5분", "intensity": "Easy"}, {"date": "2026-08-14", "dateLabel": "08/14", "weekday": "금", "type": "걷기", "desc": "빠르게 걷기 40분", "intensity": "가볍게"}, {"date": "2026-08-15", "dateLabel": "08/15", "weekday": "토", "type": "러닝", "desc": "3분 달리기 + 2분 걷기 × 6", "intensity": "Easy"}, {"date": "2026-08-16", "dateLabel": "08/16", "weekday": "일", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-08-17", "dateLabel": "08/17", "weekday": "월", "type": "근력", "desc": "빠르게 걷기 30분", "intensity": "가볍게"}, {"date": "2026-08-18", "dateLabel": "08/18", "weekday": "화", "type": "러닝", "desc": "5분 달리기 + 2분 걷기 × 5", "intensity": "Easy"}, {"date": "2026-08-19", "dateLabel": "08/19", "weekday": "수", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-08-20", "dateLabel": "08/20", "weekday": "목", "type": "러닝", "desc": "8분 달리기 + 2분 걷기 × 4", "intensity": "Easy"}, {"date": "2026-08-21", "dateLabel": "08/21", "weekday": "금", "type": "걷기", "desc": "걷기 30~40분 + 근력", "intensity": "가볍게"}, {"date": "2026-08-22", "dateLabel": "08/22", "weekday": "토", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-08-23", "dateLabel": "08/23", "weekday": "일", "type": "러닝", "desc": "10분 달리기 + 2분 걷기 × 4", "intensity": "Easy"}, {"date": "2026-08-24", "dateLabel": "08/24", "weekday": "월", "type": "근력", "desc": "빠르게 걷기 30분", "intensity": "가볍게"}, {"date": "2026-08-25", "dateLabel": "08/25", "weekday": "화", "type": "러닝", "desc": "12분 달리기 + 2분 걷기 × 3", "intensity": "Easy"}, {"date": "2026-08-26", "dateLabel": "08/26", "weekday": "수", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-08-27", "dateLabel": "08/27", "weekday": "목", "type": "러닝", "desc": "15분 달리기 → 2분 걷기 → 15분 달리기", "intensity": "Easy"}, {"date": "2026-08-28", "dateLabel": "08/28", "weekday": "금", "type": "걷기", "desc": "걷기 30~40분 + 근력", "intensity": "가볍게"}, {"date": "2026-08-29", "dateLabel": "08/29", "weekday": "토", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-08-30", "dateLabel": "08/30", "weekday": "일", "type": "롱 Run/Walk", "desc": "총 50분 Run/Walk. 10분 달리기 + 1~2분 걷기 반복", "intensity": "거리보다 시간"}, {"date": "2026-08-31", "dateLabel": "08/31", "weekday": "월", "type": "근력", "desc": "빠르게 걷기 30분", "intensity": "가볍게"}, {"date": "2026-09-01", "dateLabel": "09/01", "weekday": "화", "type": "러닝", "desc": "20분 연속 → 2분 걷기 → 10분 러닝", "intensity": "Easy"}, {"date": "2026-09-02", "dateLabel": "09/02", "weekday": "수", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-09-03", "dateLabel": "09/03", "weekday": "목", "type": "연속주", "desc": "25~30분 연속주 도전", "intensity": "Easy"}, {"date": "2026-09-04", "dateLabel": "09/04", "weekday": "금", "type": "걷기", "desc": "걷기 30분", "intensity": "가볍게"}, {"date": "2026-09-05", "dateLabel": "09/05", "weekday": "토", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-09-06", "dateLabel": "09/06", "weekday": "일", "type": "5km 도전", "desc": "5km 거리 완주 도전. 힘들면 1분 걷고 다시 달리기", "intensity": "기록 측정 아님"}, {"date": "2026-09-07", "dateLabel": "09/07", "weekday": "월", "type": "근력", "desc": "빠르게 걷기 30분", "intensity": "가볍게"}, {"date": "2026-09-08", "dateLabel": "09/08", "weekday": "화", "type": "Easy Run", "desc": "Easy 4km", "intensity": "편하게"}, {"date": "2026-09-09", "dateLabel": "09/09", "weekday": "수", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-09-10", "dateLabel": "09/10", "weekday": "목", "type": "5km 연속주", "desc": "5km 안 걷고 뛰기 도전", "intensity": "속도 무관"}, {"date": "2026-09-11", "dateLabel": "09/11", "weekday": "금", "type": "걷기", "desc": "걷기 + 근력", "intensity": "가볍게"}, {"date": "2026-09-12", "dateLabel": "09/12", "weekday": "토", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-09-13", "dateLabel": "09/13", "weekday": "일", "type": "롱런", "desc": "Easy 6km", "intensity": "편하게"}, {"date": "2026-09-14", "dateLabel": "09/14", "weekday": "월", "type": "근력", "desc": "빠르게 걷기 30분", "intensity": "가볍게"}, {"date": "2026-09-15", "dateLabel": "09/15", "weekday": "화", "type": "Easy Run", "desc": "Easy 5km", "intensity": "편하게"}, {"date": "2026-09-16", "dateLabel": "09/16", "weekday": "수", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-09-17", "dateLabel": "09/17", "weekday": "목", "type": "스피드", "desc": "1km Easy → 2분 빠르게/2분 천천히 × 5 → 1km Easy", "intensity": "빠른 구간 6:20~6:40/km"}, {"date": "2026-09-18", "dateLabel": "09/18", "weekday": "금", "type": "걷기", "desc": "걷기 + 가벼운 근력", "intensity": "가볍게"}, {"date": "2026-09-19", "dateLabel": "09/19", "weekday": "토", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-09-20", "dateLabel": "09/20", "weekday": "일", "type": "롱런", "desc": "Easy 7~7.5km", "intensity": "편하게"}, {"date": "2026-09-21", "dateLabel": "09/21", "weekday": "월", "type": "근력", "desc": "빠르게 걷기 30분", "intensity": "가볍게"}, {"date": "2026-09-22", "dateLabel": "09/22", "weekday": "화", "type": "Easy Run", "desc": "Easy 5km", "intensity": "편하게"}, {"date": "2026-09-23", "dateLabel": "09/23", "weekday": "수", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-09-24", "dateLabel": "09/24", "weekday": "목", "type": "1km 인터벌", "desc": "1km Easy → 1km × 3회(6:15~6:25/km), 사이 3분 회복 → 1km Easy", "intensity": "균일한 페이스"}, {"date": "2026-09-25", "dateLabel": "09/25", "weekday": "금", "type": "걷기", "desc": "걷기 30분", "intensity": "가볍게"}, {"date": "2026-09-26", "dateLabel": "09/26", "weekday": "토", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-09-27", "dateLabel": "09/27", "weekday": "일", "type": "롱런", "desc": "Easy 8.5~9km", "intensity": "가장 중요한 장거리"}, {"date": "2026-09-28", "dateLabel": "09/28", "weekday": "월", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-09-29", "dateLabel": "09/29", "weekday": "화", "type": "Easy+가속주", "desc": "Easy 4km + 20초 가속주 × 4", "intensity": "무리 금지"}, {"date": "2026-09-30", "dateLabel": "09/30", "weekday": "수", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-10-01", "dateLabel": "10/01", "weekday": "목", "type": "5km 테스트", "desc": "워밍업 후 5km 지속 가능한 최대 속도로 기록 측정", "intensity": "Sub-60 판정"}, {"date": "2026-10-02", "dateLabel": "10/02", "weekday": "금", "type": "휴식", "desc": "완전 휴식", "intensity": "회복"}, {"date": "2026-10-03", "dateLabel": "10/03", "weekday": "토", "type": "걷기", "desc": "가벼운 걷기", "intensity": "회복"}, {"date": "2026-10-04", "dateLabel": "10/04", "weekday": "일", "type": "Easy Run", "desc": "Easy 6km", "intensity": "편하게"}, {"date": "2026-10-05", "dateLabel": "10/05", "weekday": "월", "type": "휴식", "desc": "완전 휴식", "intensity": "테이퍼"}, {"date": "2026-10-06", "dateLabel": "10/06", "weekday": "화", "type": "Easy+GP", "desc": "Easy 4km + 1분 6:00/km × 4", "intensity": "가볍게"}, {"date": "2026-10-07", "dateLabel": "10/07", "weekday": "수", "type": "휴식", "desc": "완전 휴식", "intensity": "테이퍼"}, {"date": "2026-10-08", "dateLabel": "10/08", "weekday": "목", "type": "Easy+가속주", "desc": "Easy 20분 + 20초 가속주 × 3", "intensity": "가볍게"}, {"date": "2026-10-09", "dateLabel": "10/09", "weekday": "금", "type": "휴식", "desc": "완전 휴식", "intensity": "대회 전 완전 휴식"}, {"date": "2026-10-10", "dateLabel": "10/10", "weekday": "토", "type": "🏁 10km 대회", "desc": "10km 레이스. Sub-60 도전 목표", "intensity": "초반 2km 6:05~6:10/km"}];
let onlyIncomplete = false;
const doneKey = d => 'run58_done_' + d;
const noteKey = d => 'run58_note_' + d;

function isDone(i) { return localStorage.getItem(doneKey(i.date)) === '1'; }
function setDone(i, value) {
  if(value) localStorage.setItem(doneKey(i.date),'1');
  else localStorage.removeItem(doneKey(i.date));
  render();
}
function setNote(i, value) { localStorage.setItem(noteKey(i.date), value); }

function localToday() {
  const n = new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}

function renderToday() {
  const box = document.getElementById('todayBox');
  const t = localToday();
  let item = DATA.find(x => x.date === t);
  if(!item) {
    item = DATA.find(x => x.date >= t && !isDone(x)) || DATA.find(x => !isDone(x));
  }
  if(!item) {
    box.innerHTML = '<div class="empty">모든 일정이 완료됐어. 대회까지 잘 왔어!</div>';
    return;
  }
  box.innerHTML = `
    <div class="todayCard">
      <div class="todayDate">${item.dateLabel} (${item.weekday})</div>
      <div class="todayType">${item.type}</div>
      <div class="todayDesc">${item.desc}</div>
      <div class="todayMeta">${item.intensity}</div>
      <div class="todayActions">
        <button class="doneBtn" onclick="setDoneByDate('${item.date}', true)">완료</button>
        <button class="skipBtn" onclick="scrollToDate('${item.date}')">기록</button>
      </div>
    </div>`;
}

function setDoneByDate(date, value) {
  const item = DATA.find(x => x.date === date);
  if(item) setDone(item,value);
}

function scrollToDate(date) {
  const el = document.getElementById('d_'+date);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const t = localToday();
  DATA.forEach(item => {
    if(onlyIncomplete && isDone(item)) return;
    const c = document.createElement('div');
    c.id = 'd_'+item.date;
    c.className = 'card'+(isDone(item)?' done':'')+(item.date===t?' today':'');
    c.innerHTML = `
      <input class="cb" type="checkbox" ${isDone(item)?'checked':''}>
      <div>
        <div class="rowTop">
          <div class="date">${item.dateLabel} (${item.weekday})</div>
          <div class="tag">${item.type}</div>
        </div>
        <div class="desc">${item.desc}</div>
        <div class="meta">${item.intensity}</div>
        <input class="noteInput" placeholder="거리·시간·체중·컨디션 메모" value="${(localStorage.getItem(noteKey(item.date))||'').replace(/"/g,'&quot;')}">
      </div>`;
    c.querySelector('.cb').addEventListener('change', e => setDone(item,e.target.checked));
    c.querySelector('.noteInput').addEventListener('input', e => setNote(item,e.target.value));
    list.appendChild(c);
  });
}

function updateProgress() {
  const done = DATA.filter(isDone).length;
  const pct = Math.round(done/DATA.length*100);
  document.getElementById('bar').style.width = pct+'%';
  document.getElementById('pct').textContent = pct+'%';
  document.getElementById('count').textContent = `${done} / ${DATA.length} 완료`;
}

function toggleFilter() {
  onlyIncomplete = !onlyIncomplete;
  document.getElementById('filterBtn').textContent = onlyIncomplete ? '전체 보기' : '미완료만';
  renderList();
}

function render() {
  renderToday();
  renderList();
  updateProgress();
}
render();
</script>
</body>
</html>
